        height: 100vh;

    #background-navbar {

        height: 100vh;
        background-color: #18181900;

        position: absolute;
        margin: 0;

    }

    }

    .link {

        letter-spacing:

    }

        font-size: 2.8vw;
    }

    .navbar {
        width: 35vw;
        height: 90vh;
        margin-top: 5vh;
        transform: translateX(-100%);
        transition: transform 0.5s ease;
        background-color: #F61F1F;
        border-radius: 20px;
    }

    #navbar.open {
        transform: translateX(1vw);
    }

    .navbar-top {
        width: 85%;
        height: 10vh;
        padding: 4vh 0 0 2vw ;
    }

    .hidenav {
        background-color: #FFF9E7;
        color: #181819;
        width: fit-content;
        width: 2vw;
        height: 2vw;
        border-radius: 100px;
        border: none;
        font-size: 1vw;
        float: left;
    }

    .res_soc {
        float: right;
        width: fit-content;
    }

    .navbar-corp {
        width: 90%;
        margin-left: 5%;
        display: grid;
        grid-template-columns: repeat(1);
        grid-template-rows:8vh 8vh 8vh 8vh 8vh;
    }

    .navbar-bottom {
        width: 100%;
        height: 30vh;
    }
